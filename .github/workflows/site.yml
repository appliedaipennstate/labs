name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer run waits instead of cancelling, and it builds from the
# latest main, so every merged card is included.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      # Members only ever get https links, so check the wall the same way they reach it.
      # curl fails on a bad certificate, so a stalled certificate shows up here as a red run.
      - name: Check the live wall over https
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf --max-time 10 "https://labs.appliedaipennstate.com/wall.json?t=$(date +%s)" > /dev/null; then
              echo "The wall is reachable over https."; exit 0
            fi
            sleep 10
          done
          echo "::error::https://labs.appliedaipennstate.com/wall.json is not reachable with a valid certificate."
          exit 1
